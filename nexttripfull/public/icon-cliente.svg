<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <clipPath id="circle">
      <circle cx="96" cy="96" r="96"/>
    </clipPath>
  </defs>
  <!-- Fondo blanco circular -->
  <circle cx="96" cy="96" r="96" fill="#ffffff"/>
