<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background gradient - deep black to dark navy -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="40%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <!-- N shadow filter -->
    <filter id="nShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="4" dy="6" stdDeviation="5" flood-color="#000000aa"/>
    </filter>

    <!-- Arrow 3D filter -->
    <filter id="arrowShadow" x="-10%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000aa"/>
    </filter>

    <!-- Inner shine on background -->
    <linearGradient id="shineGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Arrow gold gradient for 3D effect -->
    <linearGradient id="arrowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0d98a"/>
      <stop offset="100%" stop-color="#a07840"/>
    </linearGradient>

    <!-- N white gradient -->
    <linearGradient id="nGrad" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cccccc"/>
    </linearGradient>
  </defs>

  <!-- Background black with gradient -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>

  <!-- Top shine overlay for subtle gloss -->
  <rect width="512" height="256" rx="100" fill="url(#shineGrad)"/>

  <!-- Bottom dark edge for depth -->
  <rect x="0" y="400" width="512" height="112" rx="0" fill="#00000040"/>
  <rect x="0" y="450" width="512" height="62" rx="0" fill="#00000030"/>

  <!-- N shadow (slightly offset dark copy) -->
  <rect x="116" y="147" width="48" height="214" rx="3" fill="#ffffff08"/>
  <rect x="316" y="147" width="48" height="214" rx="3" fill="#ffffff08"/>
  <polygon points="116,147 164,147 364,332 364,361 316,361 116,176" fill="#ffffff08"/>

  <!-- N in white gradient with shadow filter -->
  <g filter="url(#nShadow)">
    <rect x="110" y="140" width="48" height="214" rx="3" fill="url(#nGrad)"/>
    <rect x="310" y="140" width="48" height="214" rx="3" fill="url(#nGrad)"/>
    <polygon points="110,140 158,140 358,325 358,354 310,354 110,169" fill="url(#nGrad)"/>
  </g>

  <!-- N highlight edge (top-left bevel) -->
  <rect x="110" y="140" width="48" height="4" rx="2" fill="#ffffff55"/>
  <rect x="110" y="140" width="4" height="214" rx="2" fill="#ffffff33"/>
  <rect x="310" y="140" width="4" height="214" rx="2" fill="#ffffff33"/>

  <!-- Arrow group with shadow -->
  <g filter="url(#arrowShadow)">
    <!-- Dark outline for depth -->
    <rect x="204" y="219" width="207" height="50" rx="7" fill="#000000"/>
    <polygon points="381,185 484,244 381,303" fill="#000000"/>
    <!-- Dark gold middle layer -->
    <rect x="207" y="222" width="201" height="44" rx="6" fill="#7a5010"/>
    <polygon points="385,190 478,244 385,298" fill="#7a5010"/>
    <!-- Gold gradient fill -->
    <rect x="210" y="225" width="195" height="38" rx="5" fill="url(#arrowGrad)"/>
    <polygon points="390,196 468,244 390,292" fill="url(#arrowGrad)"/>
  </g>

  <!-- Arrow top shine (3D highlight) -->
  <rect x="210" y="225" width="195" height="10" rx="5" fill="#f0d98a" opacity="0.6"/>
  <!-- Arrow bottom shadow -->
  <rect x="210" y="253" width="195" height="10" rx="0" fill="#00000030"/>
</svg>
